<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        margin: 0;
        padding: 0;
    }
    section{
        width: 100vw;
        height: 100vh;
        background-color: #0a1533;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    a{
        font-family: sans-serif; 
        text-decoration: none;
        color: #ff0000;
        border: 2px solid #ff0000;
        padding: 10px 30px;
        transition: .5s;
        border-radius: 5px;
    }
    a:hover{
        color: #fff;
        background: red;
        box-shadow: 0 0 50px red,
                    0 0 50px red;
    }
</style>
<body>
    <section>
    <a href="#">CLICK HERE</a>
    </section>
</body>
</html>
